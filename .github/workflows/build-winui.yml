# Builds the x86-64 Windows executable for the WinUI 3 rewrite.
#
# WinUI 3 cannot be cross-compiled from macOS or Linux -- the Windows App SDK build chain
# is Windows-only -- so this workflow is how a Windows binary gets produced without a
# Windows machine to hand. Download it from the run's "Artifacts" section.
name: Build WinUI (x64)

on:
  push:
    branches: [6451-WinUI]
    paths:
      - 'winui/**'
      - '.github/workflows/build-winui.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [6451-WinUI]
    paths:
      - 'winui/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Only needed by the tagged-release step below; harmless for ordinary branch builds.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Every dotnet invocation runs from winui/, so winui/global.json applies. Without it the
      # runner's default SDK (currently .NET 10) is selected, and Windows App SDK 1.6 then looks
      # for its PRI build task under an SDK layout that does not exist there.
      - name: Restore
        working-directory: winui
        run: dotnet restore Ni6451.sln

      - name: Self-test (rolling buffer, unit conversions, .npz format)
        working-directory: winui
        run: dotnet run --project src/Ni6451.Tools/Ni6451.Tools.csproj -c Release -- selftest

      - name: Publish x64
        working-directory: winui
        run: >
          dotnet publish src/Ni6451.App/Ni6451.App.csproj
          -c Release -r win-x64 -p:Platform=x64 --self-contained true
          -v normal
          -o ../artifacts/win-x64

      - name: Publish the command line tool
        working-directory: winui
        run: >
          dotnet publish src/Ni6451.Tools/Ni6451.Tools.csproj
          -c Release -r win-x64 --self-contained true
          -o ../artifacts/win-x64-tools

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: Ni6451-win-x64
          path: artifacts/win-x64
          if-no-files-found: error
          retention-days: 90

      - name: Upload the command line tool
        uses: actions/upload-artifact@v4
        with:
          name: ni6451-cli-win-x64
          path: artifacts/win-x64-tools
          if-no-files-found: error
          retention-days: 90

      # Artifacts need a GitHub login and expire. A tagged build additionally gets a
      # permanent, publicly downloadable zip attached to a Release.
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Ni6451-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath $zip
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes $zip
          } else {
            gh release upload $env:GITHUB_REF_NAME $zip --clobber
          }
